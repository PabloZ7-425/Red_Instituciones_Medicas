# 4 instituciones = 4 motores distintos
# Hospital general      -> PostgreSQL
# Centro pediatrico     -> MySQL
# Laboratorio clinico   -> MongoDB
# Clinica odontologica  -> Firebase (emulador de Firestore)

services:
  local-setup:
    profiles: ["maintenance"]
    build: ./backend
    command: python /ops/bootstrap_local.py
    environment:
      PABLO_LOCAL_SETUP: backups-verified
      PYTHONPATH: /app
      IDENTITY_DB_MODE: postgres
      IDENTITY_DB_HOST: postgres
      IDENTITY_DB_NAME: hospital
      IDENTITY_DB_SCHEMA: identidad
      IDENTITY_APP_PASSWORD: ${IDENTITY_APP_PASSWORD}
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MONGO_URI: mongodb://mongo:27017/laboratorio?replicaSet=rs0
      FIRESTORE_MODE: emulator
      FIRESTORE_EMULATOR_HOST: firestore:8080
      FIREBASE_PROJECT_ID: demo-historiales
    volumes:
      - ./backend:/app:ro
      - ./ops:/ops:ro
      - ./db/mongo:/mongo-schema:ro
      - ./.local/bootstrap:/private

  integration-tests:
    profiles: ["tests"]
    extends:
      service: pediatria-tests
    environment:
      TEST_MONGO_REPLICA: "1"
      MONGO_INFRA_TEST_DB: test_b5_infra
      MONGO_URI: mongodb://mongo:27017/laboratorio?replicaSet=rs0
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully

  mongo-backup:
    profiles: ["maintenance"]
    image: mongo:7
    command: ["bash", "/ops/backup.sh"]
    volumes:
      - ./ops/mongo:/ops:ro
      - ./.local/mongo-backups:/backups

  mongo-init:
    image: mongo:7
    command: ["mongosh", "--quiet", "--nodb", "/ops/init.js"]
    volumes:
      - ./ops/mongo:/ops:ro
    depends_on:
      mongo:
        condition: service_started

  pediatria-tests:
    profiles: ["tests"]
    build: ./backend
    command: python manage.py test apps.historiales apps.identidad --settings=config.test_settings --keepdb -v 1
    environment:
      TEST_PEDIATRIA_MYSQL: "1"
      PEDIATRIA_TEST_DB: test_b4_pediatria
      PEDIATRIA_SCHEMA_DIR: /mysql-schema
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TEST_HOSPITAL_POSTGRES: "1"
      TEST_IDENTITY_POSTGRES: "1"
      IDENTITY_DB_HOST: postgres
      IDENTITY_DB_NAME: hospital
      IDENTITY_DB_SCHEMA: identidad
      IDENTITY_MIGRATOR_PASSWORD: ${IDENTITY_MIGRATOR_PASSWORD:?Configure IDENTITY_MIGRATOR_PASSWORD}
      HOSPITAL_TEST_DB: test_b3_hospital
      HOSPITAL_SCHEMA_DIR: /schema
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
    volumes:
      - ./backend:/app:ro
      - ./db/postgres:/schema:ro
      - ./db/mysql:/mysql-schema:ro
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy

  pediatria-migrate:
    profiles: ["maintenance"]
    image: mysql:8.4
    command: ["bash", "/schema/migrate.sh", "inventory"]
    environment:
      MYSQL_DATABASE: pediatrico
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      PEDIATRIA_APP_PASSWORD: ${PEDIATRIA_APP_PASSWORD:?Configure PEDIATRIA_APP_PASSWORD}
    volumes:
      - ./db/mysql:/schema:ro
      - ./.local/mysql-backups:/backups
    depends_on:
      mysql:
        condition: service_healthy

  hospital-tests:
    profiles: ["tests"]
    build: ./backend
    command: python manage.py test apps.historiales apps.identidad --settings=config.test_settings --keepdb -v 1
    environment:
      TEST_HOSPITAL_POSTGRES: "1"
      TEST_IDENTITY_POSTGRES: "1"
      IDENTITY_DB_HOST: postgres
      IDENTITY_DB_NAME: hospital
      IDENTITY_DB_SCHEMA: identidad
      IDENTITY_MIGRATOR_PASSWORD: ${IDENTITY_MIGRATOR_PASSWORD:?Configure IDENTITY_MIGRATOR_PASSWORD}
      HOSPITAL_TEST_DB: test_b3_hospital
      HOSPITAL_SCHEMA_DIR: /schema
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
    volumes:
      - ./backend:/app:ro
      - ./db/postgres:/schema:ro
    depends_on:
      postgres:
        condition: service_healthy

  hospital-migrate:
    profiles: ["maintenance"]
    image: postgres:16
    command: ["bash", "/schema/migrate.sh", "inventory"]
    environment:
      PGHOST: postgres
      PGDATABASE: hospital
      PGUSER: ${PG_USER}
      PGPASSWORD: ${PG_PASSWORD}
      HOSPITAL_APP_PASSWORD: ${HOSPITAL_APP_PASSWORD:?Configure HOSPITAL_APP_PASSWORD}
    volumes:
      - ./db/postgres:/schema:ro
      - ./.local/postgres-backups:/backups
      - ./backend/apps/historiales/fixtures/postgres_legacy.sql:/legacy.sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  identity-schema:
    profiles: ["maintenance"]
    image: postgres:16
    command: ["sh", "/identity/consolidated-roles.sh"]
    environment:
      PGHOST: postgres
      PGDATABASE: hospital
      PGUSER: ${PG_USER}
      PGPASSWORD: ${PG_PASSWORD}
      IDENTITY_APP_PASSWORD: ${IDENTITY_APP_PASSWORD:?Configure IDENTITY_APP_PASSWORD}
      IDENTITY_MIGRATOR_PASSWORD: ${IDENTITY_MIGRATOR_PASSWORD:?Configure IDENTITY_MIGRATOR_PASSWORD}
    volumes:
      - ./db/identity:/identity:ro
    depends_on:
      postgres:
        condition: service_healthy

  identity-migrate:
    profiles: ["maintenance"]
    build: ./backend
    command: python manage.py migrate --database identity_migration --noinput
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-development-only-key}
      IDENTITY_DB_MODE: postgres
      IDENTITY_DB_HOST: postgres
      IDENTITY_DB_NAME: hospital
      IDENTITY_DB_SCHEMA: identidad
      IDENTITY_MIGRATOR_PASSWORD: ${IDENTITY_MIGRATOR_PASSWORD:?Configure IDENTITY_MIGRATOR_PASSWORD}
    volumes:
      - ./backend:/app:ro
      - ./.local/identity-backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

  identity-consolidate:
    profiles: ["maintenance"]
    extends:
      service: identity-migrate
    command: python /ops/auc12/consolidate_identity.py
    environment:
      AUC12_SETUP: consolidate-identity
      IDENTITY_APP_PASSWORD: ${IDENTITY_APP_PASSWORD:?Configure IDENTITY_APP_PASSWORD}
      IDENTITY_SOURCE_HOST: identidad
    volumes:
      - ./ops:/ops:ro

  postgres:
    image: postgres:16
    container_name: hc_postgres
    environment:
      POSTGRES_DB: hospital
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d hospital"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.4
    container_name: hc_mysql
    environment:
      MYSQL_DATABASE: pediatrico
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysqldata:/var/lib/mysql
      - ./db/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  mongo:
    image: mongo:7
    container_name: hc_mongo
    command: ["mongod", "--bind_ip_all", "--replSet", "rs0"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodata:/data/db
      - ./db/mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "quit(db.hello().setName === 'rs0' && db.hello().isWritablePrimary ? 0 : 1)"
        ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

  firestore:
    build: ./db/firebase
    command: ["sh", "/firebase/persistent-emulator.sh"]
    stop_grace_period: 60s
    volumes:
      - firestoredata:/data
      - ./db/firebase/persistent-emulator.sh:/firebase/persistent-emulator.sh:ro
    container_name: hc_firestore
    ports:
      - "127.0.0.1:8082:8080"
      - "127.0.0.1:4000:4000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://localhost:8080',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  adminer:
    image: adminer
    container_name: hc_adminer
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - postgres
      - mysql

  backend:
    build: ./backend
    container_name: hc_backend
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-development-only-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DJANGO_COOKIE_SECURE: ${DJANGO_COOKIE_SECURE:-false}
      IDENTITY_DB_MODE: postgres
      IDENTITY_DB_HOST: postgres
      IDENTITY_DB_NAME: hospital
      IDENTITY_DB_SCHEMA: identidad
      IDENTITY_APP_PASSWORD: ${IDENTITY_APP_PASSWORD:?Configure IDENTITY_APP_PASSWORD}

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: hospital
      PG_USER: hospital_runtime
      PG_PASSWORD: ${HOSPITAL_APP_PASSWORD:?Configure HOSPITAL_APP_PASSWORD}

      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: pediatrico
      MYSQL_USER: pediatria_runtime
      MYSQL_PASSWORD: ${PEDIATRIA_APP_PASSWORD:?Configure PEDIATRIA_APP_PASSWORD}

      MONGO_URI: "mongodb://mongo:27017/laboratorio?replicaSet=rs0"

      FIRESTORE_MODE: emulator
      FIRESTORE_EMULATOR_HOST: firestore:8080
      FIREBASE_PROJECT_ID: demo-historiales

    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      firestore:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/', timeout=3)"
        ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  frontend:
    build: ./frontend
    container_name: hc_frontend
    command: sh -c "npm run build -- --outDir /tmp/rim-frontend-dist && node /ops/serve_frontend.mjs"
    environment:
      VITE_API_URL: "http://localhost:8000/api"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - ./ops/serve_frontend.mjs:/ops/serve_frontend.mjs:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  firestoredata:
  pgdata:
  mysqldata:
  mongodata:
  frontend_node_modules:
