# 4 instituciones = 4 motores distintos
# Hospital general      -> PostgreSQL
# Centro pediatrico     -> MySQL
# Laboratorio clinico   -> MongoDB
# Clinica odontologica  -> Firebase (emulador de Firestore)

services:
  postgres:
    image: postgres:16
    container_name: hc_postgres
    environment:
      POSTGRES_DB: hospital
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d hospital"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.4
    container_name: hc_mysql
    environment:
      MYSQL_DATABASE: pediatrico
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysqldata:/var/lib/mysql
      - ./db/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  mongo:
    image: mongo:7
    container_name: hc_mongo
    command: ["mongod", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodata:/data/db
      - ./db/mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "quit(db.runCommand({ ping: 1 }).ok ? 0 : 1)"
        ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

  firestore:
    build: ./db/firebase
    container_name: hc_firestore
    ports:
      - "127.0.0.1:8082:8080"
      - "127.0.0.1:4000:4000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://localhost:8080',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  adminer:
    image: adminer
    container_name: hc_adminer
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - postgres
      - mysql

  backend:
    build: ./backend
    container_name: hc_backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-development-only-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: hospital
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}

      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: pediatrico
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

      MONGO_URI: "mongodb://mongo:27017/laboratorio"

      FIRESTORE_EMULATOR_HOST: firestore:8080
      FIREBASE_PROJECT_ID: demo-historiales

    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
      firestore:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/', timeout=3)"
        ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  frontend:
    build: ./frontend
    container_name: hc_frontend
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_URL: "http://localhost:8000/api"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  mysqldata:
  mongodata:
  frontend_node_modules: