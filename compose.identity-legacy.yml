# Temporary source for identity consolidation/rollback. Not part of the delivery deployment.
services:
  identidad:
    image: postgres:16
    environment:
      POSTGRES_DB: identidad
      POSTGRES_USER: identidad_owner
      POSTGRES_PASSWORD: ${IDENTITY_OWNER_PASSWORD:?Configure legacy identity owner password}
      IDENTITY_APP_PASSWORD: ${IDENTITY_APP_PASSWORD:?Configure IDENTITY_APP_PASSWORD}
      IDENTITY_MIGRATOR_PASSWORD: ${IDENTITY_MIGRATOR_PASSWORD:?Configure IDENTITY_MIGRATOR_PASSWORD}
    volumes:
      - identitydata:/var/lib/postgresql/data
      - ./db/identity/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U identidad_owner -d identidad"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  identitydata:
